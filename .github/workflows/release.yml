# Builds the macOS app when a version tag is pushed, and publishes it on a
# release: the app in a tarball per architecture, which the Homebrew
# formula installs and installed apps update to, with its signed update
# manifest and deltas, and the disk images. The release notes are the
# version's section of CHANGELOG.md.
#
# The app is signed ad hoc, not with a Developer ID: Gatekeeper blocks the
# disk images downloaded from a browser (see the README), while Homebrew's
# formula, which doesn't quarantine what it downloads, installs it as is.
# With a Developer ID, add the signing and notarization of MyGo's
# docs/github-actions.md before "Build".
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write # to create the release and upload to it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release builds from nothing cached
      - name: Check the tag is mygo.json's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' mygo.json)
          if [ "v$version" != "$TAG" ]; then
            echo "tag $TAG doesn't match mygo.json's version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.com
          go test ./...
      - name: Check the changelog has the version's notes
        run: |
          awk -v v="## $VERSION" '$0 == v { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "CHANGELOG.md has no section ## $VERSION" >&2
            exit 1
          fi
      - name: Build
        # The key signs the update archives, which installed apps check
        # against mygo.json's public key; the token finds the releases
        # before, for delta updates.
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "the secret MYGO_UPDATER_PRIVATE_KEY is missing: installed apps couldn't update" >&2
            exit 1
          fi
          go tool mygo build -platform darwin/arm64,darwin/amd64 -skip-notarize
      - name: Package
        # The archives are the build's own, which the manifests sign and
        # Homebrew's formula installs; the deltas update from the versions
        # before.
        run: |
          mkdir dist
          for arch in arm64 amd64; do
            dir="build/darwin-$arch"
            cp "$dir/laziergit-$VERSION-darwin-$arch.tar.gz" "$dir/update-darwin-$arch.json" "$dir/laziergit-$VERSION-$arch.dmg" dist/
            find "$dir" -maxdepth 1 -name '*.delta' -exec cp {} dist/ \;
          done
          (cd dist && shasum -a 256 * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "laziergit $VERSION" --notes-file notes.md
